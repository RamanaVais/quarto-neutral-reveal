title: Neutral Reveal
author: 冯老师
version: 1.0.1
quarto-required: ">=1.8.0"
contributes:
  format:
    revealjs:
      theme: default
      width: 1280
      height: 720
      margin: 0
      center: false
      center-title-slide: false
      slide-level: 2
      navigation-mode: linear
      slide-number: c/t
      show-slide-number: all
      progress: false
      controls: false
      transition: none
      hash: true
      highlight-style: github
      pdf-separate-fragments: false
      pdf-max-pages-per-slide: 1
      menu: true
      chalkboard: false
      css: neutral.css
      template-partials: [title-slide.html]
      include-after-body: chrome.html
      filters: [part-contract.lua, brand-header.lua]
