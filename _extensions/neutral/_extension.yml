title: Neutral Reveal
author: 冯老师
version: 1.3.0
quarto-required: ">=1.8.0"
contributes:
  format:
    revealjs:
      theme: default
      width: 1280
      height: 720
      margin: 0
      center: false
      center-title-slide: false
      slide-level: 2
      navigation-mode: linear
      slide-number: c/t
      show-slide-number: all
      progress: false
      controls: false
      transition: none
      hash: true
      highlight-style: github
      pdf-separate-fragments: false
      pdf-max-pages-per-slide: 1
      menu: true
      chalkboard: false
      # 数组顺序就是注入顺序：neutral.css 定版式基线，fit.css 只做交互适配，
      # 同特异性冲突时后者胜。include-after-body 里 chrome.html 必须先跑
      # （它给 section 打 is-content 分类），fit.html 再挂自适应。
      css:
        - neutral.css
        - fit.css
      template-partials: [title-slide.html]
      include-after-body:
        - chrome.html
        - fit.html
      filters: [part-contract.lua, brand-header.lua, fit-options.lua]
